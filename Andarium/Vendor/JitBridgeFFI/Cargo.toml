[package]
name = "jit_bridge_ffi"
version = "0.1.0"
edition = "2021"
description = "MIT-licensed C FFI over jkcoxson/idevice for on-device RemotePairing"

[lib]
name = "jit_bridge_ffi"
crate-type = ["staticlib"]

[dependencies]
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "7bd551c16c6dd2e058740d85a2d9399a51a776e9", default-features = false, features = [
  "remote_pairing",
  "aws-lc",
] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "sync", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
