# SPDX-License-Identifier: GPL-2.0-or-later
name: Andarium upstream release

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/andarium-upstream-release.yml'
      - 'Andarium/**'
      - 'GuestHost/**'
      - 'Kernarium/**'
      - 'darwin/**'
      - 'dependencies/**'
      - 'cmake/**'
      - 'kernel/**'
      - 'android/**'
      - 'scripts/**'
      - 'tools/aot/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'

permissions:
  contents: read

concurrency:
  group: andarium-upstream-release
  cancel-in-progress: false

jobs:
  detect:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
      fork_tag: ${{ steps.release.outputs.fork_tag }}
      build_floor: ${{ steps.release.outputs.build_floor }}
    steps:
      - name: Check for an unpublished upstream and fork revision
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDER_ENABLED: ${{ vars.ANDARIUM_RELEASE_BUILDER }}
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api --paginate repos/imxieyi/Kernarium/releases --slurp |
            jq -c '[.[][] | select(.draft == false and .prerelease == false)
              | select(.tag_name | test("^andarium-[0-9]+(\\.[0-9]+)+$"))
              | select(any(.assets[]; .name | test("^Andarium-[0-9.]+-[0-9]+\\.ipa$")))]
              | max_by(.published_at)')
          if [[ "$release" == null ]]; then
            echo 'No stable upstream Andarium release with an IPA was found.'
            exit 0
          fi
          tag=$(jq -r .tag_name <<< "$release")
          build=$(jq -r '[.assets[].name | capture("^Andarium-[0-9.]+-(?<build>[0-9]+)\\.ipa$").build
            | tonumber] | max' <<< "$release")
          # A fork feature update needs a new build even when upstream's tag has not changed.
          fork_tag="fork-$tag-$GITHUB_SHA"
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --slurp)
          if jq -e --arg tag "$fork_tag" 'any(.[][]; .tag_name == $tag and .draft == false)' <<< "$tags" >/dev/null; then
            echo "$fork_tag is already published."
            exit 0
          fi
          if [[ "$BUILDER_ENABLED" != true ]]; then
            echo "::warning::Build needed for $tag and fork commit $GITHUB_SHA. Set ANDARIUM_RELEASE_BUILDER=true to enable builds on GitHub-hosted runners."
            exit 0
          fi
          floor=$(jq -r --argjson upstream "$build" '
            [$upstream, (.[][] | select(.draft == false and (.tag_name | startswith("fork-andarium-")))
              | .assets[].name | capture("^Andarium-[0-9.]+-(?<build>[0-9]+)-unsigned\\.ipa$")
              | .build | tonumber)] | max' <<< "$tags")
          printf 'upstream_tag=%s\nfork_tag=%s\nbuild_floor=%s\n' "$tag" "$fork_tag" "$floor" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.upstream_tag != ''
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
      BUILD_FLOOR: ${{ needs.detect.outputs.build_floor }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare macOS build tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! xcrun --find metal >/dev/null 2>&1 || ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          brew install autoconf automake bison gettext gperf groff libtool make
          for tool in bison gettext groff make; do
            prefix=$(brew --prefix "$tool")
            printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"
          done
          python3 -m venv "$RUNNER_TEMP/andarium-python"
          "$RUNNER_TEMP/andarium-python/bin/python" -m pip install meson Mako PyYAML packaging
          # Mesa's isolated tool PATH includes the Meson and Python directory.
          # Only Bison needs replacing. Use Apple's SDK-compatible Flex.
          ln -s "$(brew --prefix bison)/bin/bison" "$RUNNER_TEMP/andarium-python/bin/bison"
          "$RUNNER_TEMP/andarium-python/bin/bison" --version
          /usr/bin/flex --version
          rustup target add aarch64-apple-ios
          printf '%s\n' "$RUNNER_TEMP/andarium-python/bin" >> "$GITHUB_PATH"
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
      - name: Archive Andarium and package an unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The runner can tear down image mounts at the end of a step.
          # Keep the mount alive through the build and copy out only the deliverables.
          scratch=$(mktemp -d "$RUNNER_TEMP/andarium-volume.XXXXXXXX")
          mkdir "$scratch/base" "$scratch/work"
          image="$scratch/build.asif"
          diskutil image create blank --format ASIF --size 75g --volumeName AndariumBase --fs APFS "$image"
          diskutil image attach --nobrowse --mountPoint "$scratch/base" "$image"
          trap 'diskutil eject "$scratch/base" || true' EXIT
          container=$(diskutil info -plist "$scratch/base" | plutil -extract APFSContainerReference raw -o - -)
          label="AndariumBuild-${scratch##*.}"
          diskutil apfs addVolume "$container" APFSX "$label" -nomount
          device=$(diskutil apfs list -plist "$container" | python3 -c '
          import plistlib, sys
          volumes = plistlib.loads(sys.stdin.buffer.read())["Containers"][0]["Volumes"]
          print(next(volume["DeviceIdentifier"] for volume in volumes if volume["Name"] == sys.argv[1]))
          ' "$label")
          diskutil mount nobrowse -mountPoint "$scratch/work" "$device"
          touch "$scratch/work/case-probe"
          test ! -e "$scratch/work/CASE-PROBE"
          rm "$scratch/work/case-probe"
          df -h "$scratch/work" "$RUNNER_TEMP"
          bash Andarium/scripts/build-upstream-release.sh "$UPSTREAM_TAG" "$BUILD_FLOOR" 1 "$scratch/work/build"
          mkdir "$RUNNER_TEMP/andarium-publish"
          cp "$scratch/work/build/publish/"* "$RUNNER_TEMP/andarium-publish/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: vars.ANDARIUM_VERIFIED_RELEASE_COMMIT == github.sha
        with:
          name: andarium-release
          path: ${{ runner.temp }}/andarium-publish/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [detect, build]
    # The embedded VM requires a device boot and redistribution review before public release.
    if: vars.ANDARIUM_VERIFIED_RELEASE_COMMIT == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
      FORK_TAG: ${{ needs.detect.outputs.fork_tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: andarium-release
          path: publish
      - name: Publish the IPA and its corresponding source
        shell: bash
        run: |
          set -euo pipefail
          (cd publish && sha256sum --check SHA256SUMS)
          if ! gh release view "$FORK_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            gh release create "$FORK_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "Andarium ${UPSTREAM_TAG#andarium-} (fork ${GITHUB_SHA:0:12})" \
              --notes "Unsigned iOS IPA. Re-sign it before installing. Built against upstream $UPSTREAM_TAG and fork commit $GITHUB_SHA; the exact merged source is attached."
          fi
          [[ $(gh release view "$FORK_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) == true ]]
          gh release upload "$FORK_TAG" --repo "$GITHUB_REPOSITORY" --clobber publish/*
          gh release edit "$FORK_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
